<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gut Run</title>
  <link rel="stylesheet" href="gut-run.css">
  <script src="gut-run.js" defer></script>
</head>
<body>
  <main class="stage" aria-label="Gut Run" data-state="loading">
    <canvas id="playfield" width="720" height="1280" tabindex="-1"
      aria-label="Spielfeld. Tippen oder die Leertaste drücken, um zu springen."></canvas>
    <img class="layer logo" src="assets/logo.png" alt="Your Logo">
    <img class="layer tutorial" src="assets/01_game/tut.png" alt="Bringe Poo durch den Darm ans Ziel.">

    <p id="status" class="status" role="status">Gut Run wird geladen …</p>
    <button id="start" class="start" type="button" hidden>
      <img src="assets/gesture.png" alt="Tippen, um Gut Run zu starten">
    </button>

    <section id="failed" class="endcard" aria-label="Lauf beendet" hidden>
      <img class="layer" src="assets/02_endcard/fail/bubble.png" alt="">
      <img class="layer" src="assets/02_endcard/fail/bac1.png" alt="">
      <img class="layer" src="assets/02_endcard/fail/bac2.png" alt="">
      <img class="layer" src="assets/02_endcard/fail/bac3.png" alt="">
      <img class="layer" src="assets/02_endcard/fail/bac4.png" alt="">
      <img class="layer" src="assets/02_endcard/fail/bac5.png" alt="">
      <img class="layer" src="assets/02_endcard/fail/sad.png" alt="">
      <img class="layer" src="assets/02_endcard/fail/hl.png"
        alt="Poo, das tat weh! Erfahre jetzt, was deinem Darm guttut.">
      <a class="image-control fail-cta clickout" target="_blank" rel="noopener">
        <img src="assets/02_endcard/fail/cta.png" alt="Jetzt informieren!">
      </a>
      <button id="replay" class="image-control replay" type="button">
        <img src="assets/02_endcard/fail/replay.png" alt="Nochmal spielen">
      </button>
    </section>

    <section id="won" class="endcard" aria-label="Ziel erreicht" hidden>
      <img class="layer" src="assets/02_endcard/win/bubble.png" alt="">
      <img class="layer" src="assets/02_endcard/win/happy.png" alt="">
      <img class="layer" src="assets/02_endcard/win/konfetti.png" alt="">
      <img class="layer" src="assets/02_endcard/win/hl.png"
        alt="Poo, tut das gut! Wenn du weißt, was dein Darm braucht.">
      <a class="image-control win-cta clickout" target="_blank" rel="noopener">
        <img src="assets/02_endcard/win/cta.png" alt="Jetzt mehr erfahren">
      </a>
    </section>

    <button id="mute" class="mute" type="button" aria-label="Ton stummschalten" aria-pressed="false" hidden>
      <span aria-hidden="true">🔊</span>
    </button>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fireplace preview</title>
  <style>
    body { margin: 0; background: #282828; }

    .preview {
      position: relative;
      max-width: 1672px;
      aspect-ratio: 1672 / 975;
      margin-inline: auto;
      overflow: hidden;
    }

    .fireplace {
      position: absolute;
      inset: 0 auto auto 0;
      display: grid;
      width: 1672px;
      grid-template-columns: 320px 1032px 320px;
      grid-template-rows: 250px 725px;
      grid-template-areas: "left top right" "left . right";
      transform-origin: top left;
    }

    iframe { display: block; border: 0; }
    .left { grid-area: left; }
    .top { grid-area: top; }
    .right { grid-area: right; }

    .reference-toggle:not([hidden]) {
      display: block;
      padding: 8px 12px;
      color: white;
      font: 14px system-ui, sans-serif;
      text-align: center;
    }

    .reference {
      display: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: 0.5;
      pointer-events: none;
      z-index: 1;
    }

    .show-reference .reference { display: block; }
  </style>
</head>
<body>
  <label class="reference-toggle" hidden>
    <input type="checkbox" checked> Show design reference at 50% opacity
  </label>
  <main class="preview" aria-label="Fireplace preview">
    <div class="fireplace">
      <iframe class="left" src="left.html?sync" width="320" height="975" title="Left skyscraper"></iframe>
      <iframe class="top" src="top.html?sync" width="1032" height="250" title="Top banner"></iframe>
      <iframe class="right" src="right.html?sync" width="320" height="975" title="Right skyscraper"></iframe>
    </div>
  </main>
  <template id="reference-layout">
    <svg class="reference left" viewBox="28 50 312 949" preserveAspectRatio="none" aria-hidden="true">
      <image href="assets/layout-reference.webp" width="1684" height="1018" />
    </svg>
    <svg class="reference top" viewBox="345 50 1002 244" preserveAspectRatio="none" aria-hidden="true">
      <image href="assets/layout-reference.webp" width="1684" height="1018" />
    </svg>
    <svg class="reference right" viewBox="1351 50 312 949" preserveAspectRatio="none" aria-hidden="true">
      <image href="assets/layout-reference.webp" width="1684" height="1018" />
    </svg>
  </template>
  <script>
    const preview = document.querySelector('.preview');
    const fireplace = document.querySelector('.fireplace');
    const debug = new URLSearchParams(location.search).get('debug') === '1';

    if (debug) {
      const toggle = document.querySelector('.reference-toggle');
      toggle.hidden = false;
      fireplace.append(document.getElementById('reference-layout').content.cloneNode(true));
      fireplace.classList.add('show-reference');
      toggle.querySelector('input').addEventListener('change', event => {
        fireplace.classList.toggle('show-reference', event.target.checked);
      });
    }

    new ResizeObserver(([entry]) => {
      const scale = entry.contentRect.width / fireplace.offsetWidth;
      fireplace.style.transform = `scale(${scale})`;
    }).observe(preview);

    window.addEventListener('load', () => {
      const startAt = performance.timeOrigin + performance.now() + 120;
      for (const frame of fireplace.querySelectorAll('iframe')) {
        frame.contentWindow.postMessage({ type: 'fireplace:start', startAt, showFinal: debug }, location.origin);
      }
    }, { once: true });
  </script>
</body>
</html>
